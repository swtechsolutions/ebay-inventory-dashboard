{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h1 style="font-size: 24px; color: #111827; margin-bottom: 20px;">Add New Inventory Item</h1>

    <form method="POST" action="{{ url_for('add_item') }}" enctype="multipart/form-data" style="background-color: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e5e7eb;">
        
        <!-- Basic Information -->
        <h2 style="font-size: 16px; color: #374151; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-top: 0;">Basic Information</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">SKU *</label>
                <input type="text" name="sku" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Title *</label>
                <input type="text" name="title" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Category</label>
                <select name="category" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">
                    <option value="">Select a category...</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Status</label>
                <select name="status" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">
                    <option value="Unlisted" selected>Unlisted</option>
                    <option value="Listed">Listed</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Condition</label>
                <select name="condition" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;">
                    {% for cond in conditions %}
                        <option value="{{ cond }}" {% if cond == 'Good' %}selected{% endif %}>{{ cond }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Item Description</label>
                <textarea name="description" rows="4" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="Enter item details, flaws, measurements, or specs..."></textarea>
            </div>
            
            <!-- Upload Multiple Photos -->
            <div style="grid-column: span 2;">
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Upload Photos (Hold Ctrl/Cmd to select multiple)</label>
                <input type="file" name="images" accept="image/*" multiple style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; background-color: #f9fafb;">
            </div>
        </div>

        <!-- Listing Details -->
        <h2 style="font-size: 16px; color: #374151; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-top: 24px;">Listing Details</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Listing Price ($)</label>
                <input type="number" step="0.01" min="0" name="listing_price" value="0.00" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>
        </div>

        <!-- Outgoing Fees & Costs -->
        <h2 style="font-size: 16px; color: #374151; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-top: 24px;">Outgoing Fees & Costs</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;">Item Cost ($)</label>
                <input type="number" step="0.01" min="0" name="item_cost" value="0.00" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
            </div>
        </div>

        <!-- Form Actions -->
        <div style="display: flex; gap: 12px; justify-content: flex-end; border-top: 1px solid #e5e7eb; padding-top: 16px;">
            <a href="{{ url_for('index') }}" style="background-color: #e5e7eb; color: #374151; padding: 10px 18px; border-radius: 6px; text-decoration: none;">Cancel</a>
            <button type="submit" style="background-color: #2563eb; color: #ffffff; padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Save Item</button>
        </div>
    </form>
</div>
{% endblock %}
