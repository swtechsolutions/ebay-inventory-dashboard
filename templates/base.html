<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
</head>
<body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f3f4f6; color: #111827;">

    <!-- Global Navigation Header -->
    <nav style="background-color: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 14px 24px;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            
            <!-- App Logo / Brand Link -->
            <a href="{{ url_for('index') }}" style="font-size: 18px; font-weight: bold; color: #111827; text-decoration: none;">
                📦 Inventory Tracker
            </a>

            <!-- Navigation Links (Dashboard & Add Item button) -->
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="{{ url_for('index') }}" style="color: #4b5563; text-decoration: none; font-size: 14px; font-weight: 500;">Inventory List</a>
                
                <!-- Add Item Button moved into Top Navigation Bar -->
                <a href="{{ url_for('add_item') }}" style="background-color: #2563eb; color: #ffffff; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px;">+ Add Item</a>
            </div>

        </div>
    </nav>

    <!-- Main Page Content Block -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
